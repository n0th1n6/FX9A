name: CMSIS LL boot image

on:
  push:
    branches: [cmsis-ll-port]
    paths:
      - "cmsis_ll/**"
      - "RadioStation/BSP/**"
      - "RadioStation/StdPeriph_Driver/**"
      - "port/**"
      - ".github/workflows/cmsis-ll-boot.yml"
  pull_request:
    paths:
      - "cmsis_ll/**"
      - "RadioStation/BSP/**"
      - "RadioStation/StdPeriph_Driver/**"
      - "port/**"
      - ".github/workflows/cmsis-ll-boot.yml"
  workflow_dispatch:

jobs:
  boot-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install ARM embedded GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi ninja-build
      - name: Fetch pinned official STM32F1 CMSIS and LL packages
        run: bash cmsis_ll/vendor/fetch_vendor.sh
      - name: Configure independent build
        run: |
          cmake -S cmsis_ll -B build-cmsis-ll -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/cmsis_ll/cmake/arm-none-eabi-gcc.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build
        run: cmake --build build-cmsis-ll
      - name: Validate both vector tables and stacks
        run: |
          python3 cmsis_ll/tests/verify_boot_image.py build-cmsis-ll/fx9a_boot.bin
          python3 cmsis_ll/tests/verify_boot_image.py build-cmsis-ll/fx9a_full.bin
      - name: Verify full application symbols and driver independence
        run: |
          python3 cmsis_ll/tests/verify_full_image.py \
            --elf build-cmsis-ll/fx9a_full.elf \
            --compile-commands build-cmsis-ll/compile_commands.json
      - name: Run radio logic regression tests
        run: |
          python3 tools/test_encoders.py
          python3 tools/test_frequency.py
          python3 tools/test_rx_alignment.py
      - name: Simulated native STM32F1 LL peripheral tests
        run: |
          gcc -std=c11 -O0 -Wall -Wextra -Wno-pointer-to-int-cast \
            -Wno-int-to-pointer-cast \
            -include cmsis_ll/tests/host_intrinsics.h \
            -DSTM32F103xE -DHSE_VALUE=16000000 -DHSI_VALUE=8000000 \
            -DUSE_FULL_LL_DRIVER \
            -Icmsis_ll/board \
            -Icmsis_ll/vendor/cmsis-device-f1/Include \
            -Icmsis_ll/vendor/cmsis-core/CMSIS/Core/Include \
            -Icmsis_ll/vendor/stm32f1xx-hal-driver/Inc \
            cmsis_ll/tests/native_ll_smoke.c \
            cmsis_ll/vendor/stm32f1xx-hal-driver/Src/stm32f1xx_ll_gpio.c \
            -o build-cmsis-ll/native_ll_smoke
          ./build-cmsis-ll/native_ll_smoke
      - name: DDS integer math regression
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Icmsis_ll/board \
            cmsis_ll/tests/dds_math_test.c -o build-cmsis-ll/dds_math_test
          ./build-cmsis-ll/dds_math_test
      - name: TUNE state-machine regression
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Icmsis_ll/board cmsis_ll/tests/tune_logic_test.c -o build-cmsis-ll/tune_logic_test
          ./build-cmsis-ll/tune_logic_test
      - name: Board revision filter mapping regression
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Icmsis_ll/board cmsis_ll/tests/filter_map_test.c -o build-cmsis-ll/filter_new_test
          ./build-cmsis-ll/filter_new_test
          gcc -std=c11 -Wall -Wextra -Werror -DFX9A_BOARD_ORIGINAL -Icmsis_ll/board cmsis_ll/tests/filter_map_test.c -o build-cmsis-ll/filter_original_test
          ./build-cmsis-ll/filter_original_test
      - name: Continuous tuning policy regression
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Icmsis_ll/board cmsis_ll/tests/tuning_policy_test.c -o build-cmsis-ll/tuning_policy_test
          ./build-cmsis-ll/tuning_policy_test
      - name: Meter calibration record regression
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Icmsis_ll/board cmsis_ll/tests/meter_cal_test.c -o build-cmsis-ll/meter_cal_test
          ./build-cmsis-ll/meter_cal_test
      - name: CAT malformed-frame regression
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Icmsis_ll/board cmsis_ll/tests/cat_validation_test.c -o build-cmsis-ll/cat_validation_test
          ./build-cmsis-ll/cat_validation_test
      - name: Optical VFO acceleration policy regression
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Icmsis_ll/board cmsis_ll/tests/vfo_accel_test.c -o build-cmsis-ll/vfo_accel_test
          ./build-cmsis-ll/vfo_accel_test
      - name: EEPROM settings validation regression
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Icmsis_ll/board cmsis_ll/tests/settings_validation_test.c -o build-cmsis-ll/settings_validation_test
          ./build-cmsis-ll/settings_validation_test
      - name: Inspect image sections
        run: |
          arm-none-eabi-size build-cmsis-ll/fx9a_boot.elf build-cmsis-ll/fx9a_full.elf
          arm-none-eabi-objdump -h build-cmsis-ll/fx9a_boot.elf
          arm-none-eabi-objdump -h build-cmsis-ll/fx9a_full.elf
      - name: Compare against verified v0.1.0 release
        run: |
          curl --fail --location --retry 3 \
            --output build-cmsis-ll/fx9a-v0.1.0.bin \
            https://github.com/n0th1n6/FX9A/releases/download/v0.1.0/fx9a-v0.1.0.bin
          python3 cmsis_ll/tests/compare_release.py \
            --release build-cmsis-ll/fx9a-v0.1.0.bin \
            --port build-cmsis-ll/fx9a_boot.bin
      - name: Upload debug-only images
        uses: actions/upload-artifact@v4
        with:
          name: fx9a-cmsis-ll-boot-debug-only
          path: |
            build-cmsis-ll/fx9a_boot.elf
            build-cmsis-ll/fx9a_boot.bin
            build-cmsis-ll/fx9a_boot.hex
            build-cmsis-ll/fx9a_boot.map
            build-cmsis-ll/fx9a_full.elf
            build-cmsis-ll/fx9a_full.bin
            build-cmsis-ll/fx9a_full.hex
            build-cmsis-ll/fx9a_full.map
