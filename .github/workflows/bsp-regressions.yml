name: BSP host regressions

on:
  push:
    branches:
      - bsp-io-separation
      - master
  pull_request:

jobs:
  feature-regressions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install host compiler and Python
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3
      - name: Run production-module and feature regressions
        env:
          CC: gcc
        run: python3 tools/test_features.py
